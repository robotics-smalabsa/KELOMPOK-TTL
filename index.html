<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulasi Multiplexer 16-to-1</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
.container{max-width:1250px;margin:auto;padding:24px}
h1{text-align:center;margin:0 0 8px}
.subtitle{text-align:center;color:#667085;margin-bottom:22px}
.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 8px 30px #00000012;margin-bottom:18px}
.controls{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.group{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.group-title{font-weight:700;margin-right:4px}
.switch,.data-btn{border:0;border-radius:12px;padding:11px 16px;font-size:16px;font-weight:bold;cursor:pointer;background:#e9eef5;transition:.18s}
.switch.on,.data-btn.on{background:#2563eb;color:#fff;box-shadow:0 0 0 4px #2563eb22}
.switch:hover,.data-btn:hover{transform:translateY(-2px)}
.badge{display:inline-block;min-width:30px;padding:5px 9px;border-radius:8px;text-align:center;background:#fff;color:#172033}
.switch.on .badge{background:#dbeafe;color:#1d4ed8}
.data-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:12px}
.data-btn{padding:10px 6px;font-size:14px}
.reset{display:block;margin:14px auto 0;border:0;background:#475569;color:#fff;padding:10px 18px;border-radius:10px;cursor:pointer}
.diagram{overflow:auto;border:1px solid #e5e7eb;border-radius:14px;background:#fff;padding:8px}
svg{display:block;margin:auto;width:1180px;height:auto}
.wire{fill:none;stroke-width:2.5;stroke-linecap:butt;stroke-linejoin:miter;transition:stroke .15s,stroke-width .15s,filter .15s}
.wire.on{stroke-width:4;filter:drop-shadow(0 0 3px currentColor)}
.off{stroke:#cbd5e1}
.selA.on{stroke:#2563eb}.selB.on{stroke:#16a34a}.selC.on{stroke:#f59e0b}.selD.on{stroke:#9333ea}
.selAbar.on{stroke:#93c5fd}.selBbar.on{stroke:#86efac}.selCbar.on{stroke:#fcd34d}.selDbar.on{stroke:#c4b5fd}
.data.on{stroke:#0f766e;stroke-width:4}
.term.on{stroke:#dc2626;stroke-width:4;filter:drop-shadow(0 0 3px currentColor)}
.output.on{stroke:#dc2626;stroke-width:5;filter:drop-shadow(0 0 4px currentColor)}
.rail{stroke-width:2.5}
.gate{fill:#fff;stroke:#475569;stroke-width:3}
.gate.active{fill:#fee2e2;stroke:#dc2626}
.inv{fill:#fff;stroke:#475569;stroke-width:2.5}
.dot{fill:#475569}
.dot.active{fill:#dc2626}
.text{font-size:16px;font-weight:bold;fill:#172033}
.small{font-size:13px;fill:#667085}
.rail-label{font-size:14px;font-weight:bold;fill:#172033}
.output-box{display:flex;justify-content:center}
.output{min-width:220px;text-align:center;padding:18px;border-radius:15px;background:#f8fafc;border:2px solid #dc2626}
.output .value{font-size:46px;font-weight:800;color:#dc2626;margin-top:5px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px;text-align:center;border-bottom:1px solid #e5e7eb}
th{background:#eef2ff}
.current{background:#fee2e2;font-weight:bold}
.formula{text-align:center;font-size:17px;line-height:1.8}
.legend{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:#667085}
.legend span{display:flex;align-items:center;gap:6px}
.line-sample{width:28px;height:4px;border-radius:2px}
@media(max-width:700px){
 .container{padding:12px}.card{padding:14px}.data-grid{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>
<div class="container">
  <h1>Simulasi Multiplexer 16-to-1</h1>

  <div class="card">
    <div class="controls">
      <div class="group">
        <span class="group-title">Selektor:</span>
        <button class="switch" id="btnA" onclick="toggleSel(0)">A = <span class="badge" id="aVal">0</span></button>
        <button class="switch" id="btnB" onclick="toggleSel(1)">B = <span class="badge" id="bVal">0</span></button>
        <button class="switch" id="btnC" onclick="toggleSel(2)">C = <span class="badge" id="cVal">0</span></button>
        <button class="switch" id="btnD" onclick="toggleSel(3)">D = <span class="badge" id="dVal">0</span></button>
      </div>
    </div>

    <div style="margin-top:18px;text-align:center;font-weight:700">Input Data D₀–D₁₅</div>
    <div class="data-grid" id="dataButtons"></div>
    <button class="reset" onclick="resetAll()">Reset ke 0000 dan semua D = 0</button>
  </div>

  <div class="card">
    <h2 style="text-align:center">Rangkaian Multiplexer 16-to-1</h2>
    <div class="diagram">
      <svg id="muxSvg" viewBox="0 0 1180 980" aria-label="Rangkaian multiplexer 16 to 1">
        <!-- Judul jalur selektor -->
        <text x="130" y="48" class="rail-label">A</text>
        <text x="160" y="24" class="rail-label">A̅</text>
        <text x="180" y="48" class="rail-label">B</text>
        <text x="210" y="24" class="rail-label">B̅</text>
        <text x="230" y="48" class="rail-label">C</text>
        <text x="260" y="24" class="rail-label">C̅</text>
        <text x="280" y="48" class="rail-label">D</text>
        <text x="310" y="24" class="rail-label">D̅</text>

        <!-- Inverter -->
        <path class="inv" d="M148 33 L172 33 L160 45 Z"></path>
        <circle cx="160" cy="48" r="3" fill="#475569"></circle>

        <path class="inv" d="M198 33 L222 33 L210 45 Z"></path>
        <circle cx="210" cy="48" r="3" fill="#475569"></circle>

        <path class="inv" d="M248 33 L272 33 L260 45 Z"></path>
        <circle cx="260" cy="48" r="3" fill="#475569"></circle>

        <path class="inv" d="M298 33 L322 33 L310 45 Z"></path>
        <circle cx="310" cy="48" r="3" fill="#475569"></circle>

        <!-- Select input trunks -->
        <path id="selAin" class="wire selA off" d="M135 50 V900"></path>
        <path id="selAbar" class="wire selAbar off" d="M160 50 V900"></path>
        <path id="selBin" class="wire selB off" d="M185 50 V900"></path>
        <path id="selBbar" class="wire selBbar off" d="M210 50 V900"></path>
        <path id="selCin" class="wire selC off" d="M235 50 V900"></path>
        <path id="selCbar" class="wire selCbar off" d="M260 50 V900"></path>
        <path id="selDin" class="wire selD off" d="M285 50 V900"></path>
        <path id="selDbar" class="wire selDbar off" d="M310 50 V900"></path>

        <!-- Data lines and 16 minterm AND gates are generated by JS -->
        <g id="circuit"></g>

        <!-- OR gate -->
        <path id="orGate" class="gate" d="M910 330 Q1010 490 910 650 Q955 490 910 330 Z"></path>
        <text x="934" y="500" class="text">OR</text>
        <path id="outputWire" class="wire output off" d="M1010 490 H1135"></path>
        <text x="1040" y="472" class="text">Y</text>
      </svg>
    </div>

    <div class="legend">
      <span><i class="line-sample" style="background:#2563eb"></i>A aktif</span>
      <span><i class="line-sample" style="background:#16a34a"></i>B aktif</span>
      <span><i class="line-sample" style="background:#f59e0b"></i>C aktif</span>
      <span><i class="line-sample" style="background:#9333ea"></i>D aktif</span>
      <span><i class="line-sample" style="background:#dc2626"></i>Jalur minterm aktif</span>
    </div>
  </div>

  <div class="card">
    <div class="output-box">
      <div class="output">
        <div>OUTPUT MUX (Y)</div>
        <div class="value" id="output">0</div>
        <div id="selectedInfo" class="small">D₀ terpilih</div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Tabel Seleksi</h2>
    <table>
      <thead><tr><th>A</th><th>B</th><th>C</th><th>D</th><th>Input terpilih</th><th>Y</th></tr></thead>
      <tbody id="truth"></tbody>
    </table>
  </div>

  <div class="card formula">
    <b>Y</b> = D₀A̅B̅C̅D̅ + D₁A̅B̅C̅D + D₂A̅B̅CD̅ + D₃A̅B̅CD + … + D₁₅ABCD
  </div>
</div>

<script>
const sel=[0,0,0,0];
const data=Array(16).fill(0);
const rails={A:135,Ab:160,B:185,Bb:210,C:235,Cb:260,D:285,Db:310};

function makeCircuit(){
  const g=document.getElementById('circuit');
  let html='';
  const y0=80, gap=50;

  for(let i=0;i<16;i++){
    const y=y0+i*gap;
    const gateTop=y-17, gateBottom=y+17;
    const gateIn=[y-12,y-4,y+4,y+12];

    // Data input
    html += `<path id="data${i}" class="wire data off" d="M35 ${y} H475"/>`;
    html += `<text x="10" y="${y+5}" class="text">D${i}</text>`;

    // Four selector inputs. Each selector has a clean vertical drop to one gate input.
    const bits=[(i>>3)&1,(i>>2)&1,(i>>1)&1,i&1];
    const rx=[bits[0]?rails.A:rails.Ab,bits[1]?rails.B:rails.Bb,bits[2]?rails.C:rails.Cb,bits[3]?rails.D:rails.Db];
    const classes=[bits[0]?'selA':'selAbar',bits[1]?'selB':'selBbar',bits[2]?'selC':'selCbar',bits[3]?'selD':'selDbar'];

    rx.forEach((x,k)=>{
      html += `<path id="tap${i}_${k}" class="wire ${classes[k]} off" d="M${x} ${y} V${gateIn[k]} H475"/>`;
      html += `<circle id="dot${i}_${k}" class="dot" cx="${x}" cy="${y}" r="3.3"/>`;
    });

    // AND gate
    html += `<path id="and${i}" class="gate" d="M475 ${gateTop} H505 Q535 ${y} 505 ${gateBottom} H475 Z"/>`;
    html += `<text x="480" y="${y+5}" class="small">AND</text>`;

    // AND output to OR, with stepped paths to avoid collisions
    const ox=560 + (i%4)*55;
    const oy=360 + Math.floor(i/4)*55;
    html += `<path id="term${i}" class="wire term off" d="M535 ${y} H${ox} V${oy} H875"/>`;
  }
  g.innerHTML=html;
}

function calc(){
  const [A,B,C,D]=sel;
  const index=(A<<3)|(B<<2)|(C<<1)|D;
  const Y=data[index];

  document.getElementById('output').textContent=Y;
  document.getElementById('selectedInfo').textContent=`D${index} terpilih`;

  ['A','B','C','D'].forEach((x,i)=>{
    document.getElementById(x.toLowerCase()+'Val').textContent=sel[i];
    document.getElementById('btn'+x).classList.toggle('on',!!sel[i]);
  });

  const on=(id,v)=>document.getElementById(id)?.classList.toggle('on',!!v);

  on('selAin',A); on('selAbar',!A);
  on('selBin',B); on('selBbar',!B);
  on('selCin',C); on('selCbar',!C);
  on('selDin',D); on('selDbar',!D);

  for(let i=0;i<16;i++){
    const active=i===index;
    on('and'+i,active);
    on('data'+i,data[i]);
    on('term'+i,active && !!Y);

    const bits=[(i>>3)&1,(i>>2)&1,(i>>1)&1,i&1];
    for(let k=0;k<4;k++){
      const selectedLiteral=bits[k]===sel[k];
      on(`tap${i}_${k}`,active && selectedLiteral);
      const dot=document.getElementById(`dot${i}_${k}`);
      if(dot) dot.classList.toggle('active',active && selectedLiteral);
    }
  }
  on('orGate',!!Y);
  on('outputWire',!!Y);

  document.querySelectorAll('#truth tr').forEach(tr=>{
    tr.classList.toggle('current',tr.dataset.bits===sel.join(''));
  });
}

function toggleSel(i){sel[i]^=1;calc()}
function toggleData(i){data[i]^=1;calc()}
function resetAll(){sel.fill(0);data.fill(0);calc()}

const db=document.getElementById('dataButtons');
db.innerHTML=Array.from({length:16},(_,i)=>
  `<button class="data-btn" id="db${i}" onclick="toggleData(${i})">D${i} = <span>${data[i]}</span></button>`
).join('');

function updateDataButtons(){
  for(let i=0;i<16;i++){
    const b=document.getElementById('db'+i);
    b.classList.toggle('on',!!data[i]);
    b.querySelector('span').textContent=data[i];
  }
}

const oldCalc=calc;
calc=function(){
  oldCalc();
  updateDataButtons();
};

makeCircuit();
const rows=[];
for(let n=0;n<16;n++){
  const A=(n>>3)&1,B=(n>>2)&1,C=(n>>1)&1,D=n&1;
  rows.push(`<tr data-bits="${A}${B}${C}${D}"><td>${A}</td><td>${B}</td><td>${C}</td><td>${D}</td><td>D${n}</td><td id="tv${n}">—</td></tr>`);
}
document.getElementById('truth').innerHTML=rows.join('');

function updateTruth(){
  for(let n=0;n<16;n++) document.getElementById('tv'+n).textContent=data[n];
}
const originalCalc=calc;
calc=function(){
  originalCalc();
  updateTruth();
};
calc();
</script>
</body>
</html>
